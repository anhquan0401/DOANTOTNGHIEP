name: .NET CI with Docker & Telegram

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # (Tùy chọn) Bạn có thể setup .NET và chạy UnitTest ở đây trước khi build Docker
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          
      - name: Restore dependencies
        run: dotnet restore
        
      - name: Build
        run: dotnet build --no-restore

      # Chạy kiểm tra xem Dockerfile cấu hình có đúng không và có build thành công không
      - name: Build Docker Image
        run: docker build -t my-dotnet-app:${{ github.sha }} .

      # Báo thành công về Telegram
      - name: Send Telegram Success
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            ✅ *BUILD .NET & DOCKER THÀNH CÔNG!*
            - Nhánh: ${{ github.ref_name }}
            - Người commit: ${{ github.actor }}
            - Xem chi tiết: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # Báo thất bại về Telegram
      - name: Send Telegram Failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            ❌ *BUILD THẤT BẠI! CẦN SỬA LỖI GẤP!*
            - Có thể lỗi do Code .NET hoặc file Dockerfile.
            - Xem chi tiết: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
